name: Reusable - Blue-Green Deploy en K3s

on:
  workflow_call:
    inputs:
      ssh-user: { required: false, type: string, default: ubuntu }
      namespace: { required: false, type: string, default: default }
      app-name: { required: false, type: string, default: demo-api }
      image-uri: { required: true, type: string }
      health-path: { required: false, type: string, default: /health }
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      K3S_SERVER_IP:
        required: true

jobs:
  blue-green:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Generar script remoto
        run: |
          cat > remote-deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          APP="$1"
          NS="$2"
          IMAGE="$3"
          HEALTH_PATH="$4"

          ACTIVE=$(sudo k3s kubectl get service ${APP}-service -n ${NS} -o jsonpath='{.spec.selector.version}' 2>/dev/null || true)
          if [ -z "$ACTIVE" ]; then
            ACTIVE="blue"
          fi
          if [ "$ACTIVE" = "blue" ]; then IDLE="green"; else IDLE="blue"; fi
          echo "Activo=$ACTIVE Idle=$IDLE"

          sudo k3s kubectl set image deployment/${APP}-${IDLE} ${APP}=${IMAGE} -n ${NS}
          sudo k3s kubectl rollout status deployment/${APP}-${IDLE} -n ${NS} --timeout=90s

          IDLE_IP=$(sudo k3s kubectl get svc ${APP}-${IDLE}-service -n ${NS} -o jsonpath='{.spec.clusterIP}')
          OK=0
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://${IDLE_IP}${HEALTH_PATH}" || echo "000")
            echo "Intento $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 3
          done
          if [ "$OK" != "1" ]; then
            echo "Fallo: color idle no respondio 200, no se movio trafico"
            exit 1
          fi

          sudo k3s kubectl patch service ${APP}-service -n ${NS} \
            -p "{\"spec\":{\"selector\":{\"app\":\"${APP}\",\"version\":\"${IDLE}\"}}}"
          echo "Trafico movido a ${IDLE}"

          sleep 5
          PUB_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://localhost:30080${HEALTH_PATH}" || echo "000")
          echo "Smoke test post-switch -> HTTP $PUB_CODE"
          if [ "$PUB_CODE" != "200" ]; then
            echo "Fallo post-switch, revirtiendo a ${ACTIVE}"
            sudo k3s kubectl patch service ${APP}-service -n ${NS} \
              -p "{\"spec\":{\"selector\":{\"app\":\"${APP}\",\"version\":\"${ACTIVE}\"}}}"
            exit 1
          fi

          echo "DEPLOY_OK color=${IDLE}"
          SCRIPT
          chmod +x remote-deploy.sh

      - name: Copiar script al servidor
        run: |
          scp -o StrictHostKeyChecking=accept-new remote-deploy.sh \
            ${{ inputs.ssh-user }}@${{ secrets.K3S_SERVER_IP }}:/tmp/remote-deploy.sh

      - name: Ejecutar despliegue Blue-Green remoto
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ inputs.ssh-user }}@${{ secrets.K3S_SERVER_IP }} \
            "bash /tmp/remote-deploy.sh '${{ inputs.app-name }}' '${{ inputs.namespace }}' '${{ inputs.image-uri }}' '${{ inputs.health-path }}'"
