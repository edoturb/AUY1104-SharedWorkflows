name: Reusable - Blue-Green Deploy en K3s

on:
  workflow_call:
    inputs:
      ssh-user: { required: false, type: string, default: ubuntu }
      namespace: { required: false, type: string, default: default }
      app-name: { required: false, type: string, default: demo-api }
      image-uri: { required: true, type: string }
      health-path: { required: false, type: string, default: / }
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      K3S_SERVER_IP:
        required: true

jobs:
  blue-green:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Detectar color activo (con bootstrap)
        id: detect
        run: |
          ACTIVE=$(ssh -o StrictHostKeyChecking=accept-new "${{ inputs.ssh-user }}@${{ secrets.K3S_SERVER_IP }}" \
            "sudo k3s kubectl get service ${{ inputs.app-name }}-service -n ${{ inputs.namespace }} -o jsonpath='{.spec.selector.version}' 2>/dev/null || true")
          if [ -z "$ACTIVE" ]; then
            echo "⚠️ Sin color activo previo, asumiendo bootstrap → blue"
            ACTIVE="blue"
          fi
          [ "$ACTIVE" = "blue" ] && IDLE="green" || IDLE="blue"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "idle=$IDLE" >> "$GITHUB_OUTPUT"
          echo "🔵🟢 Activo=$ACTIVE / Idle=$IDLE"

      - name: Desplegar imagen nueva en color idle
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ inputs.ssh-user }}@${{ secrets.K3S_SERVER_IP }}" "
            sudo k3s kubectl set image deployment/${{ inputs.app-name }}-${{ steps.detect.outputs.idle }} \
              ${{ inputs.app-name }}=${{ inputs.image-uri }} -n ${{ inputs.namespace }} &&
            sudo k3s kubectl rollout status deployment/${{ inputs.app-name }}-${{ steps.detect.outputs.idle }} \
              -n ${{ inputs.namespace }} --timeout=90s
          "

      - name: Validación de salud pre-switch (status + latencia)
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ inputs.ssh-user }}@${{ secrets.K3S_SERVER_IP }}" '
            URL="http://'"${{ inputs.app-name }}"'-'"${{ steps.detect.outputs.idle }}"'-service.'"${{ inputs.namespace }}"'.svc.cluster.local'"${{ inputs.health-path }}"'"
            for i in 1 2 3 4 5; do
              RESULT=$(sudo k3s kubectl run health-pre-'"${{ github.run_id }}"' --rm -i --restart=Never \
                --image=curlimages/curl:8.9.1 -n '"${{ inputs.namespace }}"' -- \
                curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 5 "$URL" 2>/dev/null)
              CODE=$(echo "$RESULT" | awk "{print \$1}")
              echo "Intento $i -> $RESULT"
              if [ "$CODE" = "200" ]; then exit 0; fi
              sleep 3
            done
            echo "Fallo: el color idle no respondio 200 tras 5 intentos"
            exit 1
          '

      - name: Cambiar tráfico al color idle (switch atómico)
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ inputs.ssh-user }}@${{ secrets.K3S_SERVER_IP }}" "
            sudo k3s kubectl patch service ${{ inputs.app-name }}-service -n ${{ inputs.namespace }} \
              -p '{\"spec\":{\"selector\":{\"app\":\"${{ inputs.app-name }}\",\"version\":\"${{ steps.detect.outputs.idle }}\"}}}'
          "
          echo "✅ Tráfico movido a ${{ steps.detect.outputs.idle }}"

      - name: Smoke test post-switch
        run: |
          sleep 5
          ssh -o StrictHostKeyChecking=accept-new "${{ inputs.ssh-user }}@${{ secrets.K3S_SERVER_IP }}" "
            sudo k3s kubectl run health-post-${{ github.run_id }} --rm -i --restart=Never \
              --image=curlimages/curl:8.9.1 -n ${{ inputs.namespace }} -- \
              curl -sf --max-time 5 http://${{ inputs.app-name }}-service.${{ inputs.namespace }}.svc.cluster.local${{ inputs.health-path }}
          "

      - name: Rollback automático (pre-switch o post-switch)
        if: failure()
        run: |
          echo "🔴 Fallo detectado, revirtiendo a ${{ steps.detect.outputs.active }}"
          ssh -o StrictHostKeyChecking=accept-new "${{ inputs.ssh-user }}@${{ secrets.K3S_SERVER_IP }}" "
            sudo k3s kubectl patch service ${{ inputs.app-name }}-service -n ${{ inputs.namespace }} \
              -p '{\"spec\":{\"selector\":{\"app\":\"${{ inputs.app-name }}\",\"version\":\"${{ steps.detect.outputs.active }}\"}}}' &&
            sudo k3s kubectl run health-rollback-${{ github.run_id }} --rm -i --restart=Never \
              --image=curlimages/curl:8.9.1 -n ${{ inputs.namespace }} -- \
              curl -sf --max-time 5 http://${{ inputs.app-name }}-service.${{ inputs.namespace }}.svc.cluster.local${{ inputs.health-path }}
          "
          echo "✅ Rollback verificado: servicio estable en ${{ steps.detect.outputs.active }}"
          exit 1

      - name: Limpieza de pods de diagnóstico
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ inputs.ssh-user }}@${{ secrets.K3S_SERVER_IP }}" "
            sudo k3s kubectl delete pod -n ${{ inputs.namespace }} -l run=health-pre-${{ github.run_id }} --ignore-not-found --force --grace-period=0 2>/dev/null || true
            sudo k3s kubectl delete pod -n ${{ inputs.namespace }} -l run=health-post-${{ github.run_id }} --ignore-not-found --force --grace-period=0 2>/dev/null || true
          "
